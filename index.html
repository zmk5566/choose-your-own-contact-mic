                  zh: "一些可选指引（可以忽略，但如果不知道从哪里开始，它们会有帮助）：",
                  en: "Some optional pointers (you can ignore them, but they're there if you don't know where to start):"
                }
              },
              {
                type: "list",
                items: [
                  {
                    zh: "<strong>A. 三种材质</strong>: 金属、木头、某种活物（你的身体、一株植物、水）",
                    en: "<strong>A. Three materials</strong>: metal, wood, something alive (your body, a plant, water)"
                  },
                  {
                    zh: "<strong>B. 一个空间的三个尺度</strong>: 一面墙、一件家具、一个小物件",
                    en: "<strong>B. A space at three scales</strong>: a wall, a piece of furniture, a small object"
                  },
                  {
                    zh: "<strong>C. 一个不可见的振动</strong>: 冰箱、水管、地板、窗户共振",
                    en: "<strong>C. An invisible vibration</strong>: fridge, water pipe, floor, window resonance"
                  },
                  {
                    zh: "<strong>D. 电磁场</strong>: 自动售货机、LED 屏幕、你的手机",
                    en: "<strong>D. EM fields</strong>: vending machines, LED screens, your phone"
                  }
                ]
              }
            ]
          },
          {
            type: "step",
            title: {
              zh: "6 ·（可选）分享 — 集体聆听会（约 30 分钟）",
              en: "6 · (Optional) Share — Collective listening session (~30 min)"
            },
            blocks: [
              {
                type: "p",
                html: {
                  zh: "和其他人分享你的声音发现。每个人简短说一下自己录到了什么，以及为什么选择它。",
                  en: "Share your sonic discoveries with others. A short word from each person on what they recorded and why."
                }
              },
              {
                type: "figure",
                src: "assets/2comp.jpg",
                alt: {
                  zh: "自行车",
                  en: "a bike"
                }
              }
            ]
          }
        ]
      },
      {
        id: "take",
        title: { zh: "你会带走什么", en: "What You'll Take Home" },
        blocks: [
          {
            type: "list",
            items: [
              {
                zh: "一只你自己做的接触式麦克风",
                en: "A contact microphone you made yourself"
              },
              {
                zh: "一些录音",
                en: "Some recordings"
              },
              {
                zh: "一些新的技术知识",
                en: "Some new technical knowledge"
              },
              {
                zh: "一份可继续修改接触式麦克风的基础电路知识",
                en: "A working baseline of circuit knowledge for later modifications of your contact mic"
              }
            ]
          }
        ]
      },
      {
        id: "provide",
        title: { zh: "我们提供什么 / 你需要带什么", en: "What We Provide / What to Bring" },
        blocks: [
          {
            type: "p",
            html: {
              zh: "<strong>我们提供</strong>：不同尺寸的 piezo 片（20mm / 27mm / 35mm）、PiP 版本用的 JFET buffer 板、phantom power 版本用的 P48 平衡前级板、3.5mm TRS 与 XLR 接头、屏蔽线、3D 打印外壳、各种胶和密封材料、焊台、录音机、小调音台和音箱。",
              en: "<strong>We provide</strong>: piezo discs of different sizes (20mm / 27mm / 35mm), JFET buffer boards for PiP builds, P48 balanced preamp boards for phantom power builds, 3.5mm TRS and XLR connectors, shielded cables, 3D-printed enclosures, various adhesives and sealants, soldering stations, recorders, a small mixer and speakers."
            }
          },
          {
            type: "p",
            html: {
              zh: "<strong>你需要带</strong>：你的录音机（如果有）、一张用于我们现场录音机的 SD 卡，以及用于监听和保存录音的手机或笔记本。如果你有自己的录音机或便携录音设备，也请带来。",
              en: "<strong>You bring</strong>: your recorder (if you have one), SD card to use with the one we provide, and your phone or laptop for listening and storing recordings. If you have your own recorder or portable rig, bring it."
            }
          },
          {
            type: "p",
            html: {
              zh: "我们会提供电路图、3D 模型和其他资源。",
              en: "We will provide access to schematics, 3D models, and other resources."
            }
          }
        ]
      }
    ],
    footer: {
      prefix: {
        zh: "由参与者与组织者共同维护 · 源代码在",
        en: "Maintained by participants and organizers · Source on"
      },
      href: "https://github.com/zmk5566/choose-your-own-contact",
      label: "GitHub"
    }
  };

  const body = document.body;
  const buttons = document.querySelectorAll('.lang-toggle button');
  const app = document.getElementById('app');
  const brandTitle = document.getElementById('brand-title');
  const metaDescription = document.querySelector('meta[name="description"]');

  function text(value, lang) {
    return typeof value === 'string' ? value : value[lang];
  }

  function idAttr(id) {
    return id ? ` id="${id}"` : '';
  }

  function renderBlocks(blocks, lang) {
    return blocks.map(block => renderBlock(block, lang)).join('');
  }

  function renderBlock(block, lang) {
    if (block.type === 'p') {
      return `<p>${text(block.html, lang)}</p>`;
    }

    if (block.type === 'list') {
      return `<ul>${block.items.map(item => `<li>${text(item, lang)}</li>`).join('')}</ul>`;
    }

    if (block.type === 'figure') {
      return `
        <figure class="hero-photo">
          <img src="${block.src}" alt="${text(block.alt, lang)}" />
        </figure>
      `;
    }

    if (block.type === 'paths') {
      return `
        <div${idAttr(block.id)}>
          ${block.cards.map(card => `
            <div class="path-card">
              <h4><span class="swatch ${card.color}"></span> ${text(card.title, lang)}</h4>
              <div class="meta-line">${text(card.meta, lang)}</div>
              <p>${text(card.description, lang)}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    if (block.type === 'step') {
      return `
        <h3${idAttr(block.id)}>${text(block.title, lang)}</h3>
        ${renderBlocks(block.blocks, lang)}
      `;
    }

    return '';
  }

  function renderPage(lang) {
    const title = text(content.title, lang);
    const description = text(content.description, lang);

    brandTitle.textContent = ` ${title}`;
    document.title = title;
    if (metaDescription) metaDescription.setAttribute('content', description);

    app.innerHTML = `
      <h1>${title}<span class="sub">${text(content.subtitle, lang)}</span></h1>
      <div class="meta">
        ${content.meta.map(item => `
          <span><span class="pill">${text(item.label, lang)}</span> ${text(item.value, lang)}</span>
        `).join('')}
      </div>
      <figure class="hero-photo">
        <img src="${content.hero.src}" alt="${text(content.hero.alt, lang)}" />
      </figure>
      <p class="lede">${text(content.lede, lang)}</p>
      <nav class="nav-strip">
        ${content.nav.map(item => `<a href="#${item.id}">${text(item.label, lang)}</a>`).join('')}
      </nav>
      ${content.sections.map(section => `
        <section>
          <h2 id="${section.id}">${text(section.title, lang)}</h2>
          ${renderBlocks(section.blocks, lang)}
        </section>
      `).join('')}
      <footer>
        <p>${text(content.footer.prefix, lang)} <a href="${content.footer.href}">${content.footer.label}</a></p>
      </footer>
    `;
  }

  function setLang(lang) {
    body.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang);
    buttons.forEach(button => button.classList.toggle('active', button.dataset.set === lang));
    renderPage(lang);
    try { localStorage.setItem('cyoc-lang', lang); } catch (e) {}
  }

  buttons.forEach(button => button.addEventListener('click', () => setLang(button.dataset.set)));

  let initialLang = 'zh';
  try {
    const saved = localStorage.getItem('cyoc-lang');
    if (saved === 'zh' || saved === 'en') initialLang = saved;
    else if ((navigator.language || '').toLowerCase().startsWith('en')) initialLang = 'en';
  } catch (e) {}
  setLang(initialLang);
</script>

</body>
</html>
